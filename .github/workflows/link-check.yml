name: Link Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  local-link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http-server.log 2>&1 &
          echo $! >/tmp/http-server.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 1
          done

      - name: Check internal links
        run: python3 tools/check_links.py --base-url http://127.0.0.1:8000 --fail-on-trailing-slash

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/http-server.pid ]; then
            kill "$(cat /tmp/http-server.pid)" || true
          fi

  live-smoke-check:
    # Cloudflare Bot Fight Mode may return 403 to GitHub Actions runners, so
    # live smoke checks are not reliable as a required CI gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate published URLs
        shell: bash
        run: |
          if [ ! -f CNAME ]; then
            echo "CNAME not found. Skipping live smoke check."
            exit 0
          fi

          DOMAIN="$(tr -d '[:space:]' < CNAME)"
          if [ -z "$DOMAIN" ]; then
            echo "CNAME is empty. Skipping live smoke check."
            exit 0
          fi

          BASE_URL="https://${DOMAIN}"
          PATHS=(
            "/"
            "/store/"
            "/support/"
            "/privacy/"
            "/privacy/submit-guard/"
            "/security/"
            "/cookie-policy/"
            "/terms/"
            "/docs/"
            "/docs/decision-register/"
            "/apps/synapse/"
            "/apps/decision-register/"
            "/faq/synapse/"
            "/faq/decision-register/"
          )

          for path in "${PATHS[@]}"; do
            url="${BASE_URL}${path}"
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --retry-all-errors "${url}")"
            final_url="$(curl -L -sS -o /dev/null -w '%{url_effective}' --retry 3 --retry-delay 2 --retry-all-errors "${url}")"
            echo "${url} -> ${code} -> ${final_url}"
            if [ "${code}" != "200" ]; then
              echo "Unexpected final status for ${url}: ${code}"
              exit 1
            fi
          done
